<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%">
  <defs>
    <linearGradient id="triMGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6023d5" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
  </defs>

  <!-- Swirling Orbit Ring -->
  <ellipse cx="230" cy="95" rx="190" ry="60" fill="none" stroke="url(#ringGrad)" stroke-width="16" transform="rotate(-15 230 95)" />

  <!-- 3D Letter M with Layers -->
  <path d="M 180 145 V 50 C 180 25 215 25 235 55 C 255 25 290 25 290 50 V 145" stroke="#0f0926" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 175 140 V 45 C 175 22 210 22 230 52 C 250 22 285 22 285 45 V 140" stroke="#2c1169" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 165 135 V 40 C 165 18 200 18 220 48 C 240 18 275 18 275 40 V 135" stroke="url(#triMGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 165 135 V 40 C 165 18 200 18 220 48 C 240 18 275 18 275 40 V 135" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- Text: TRI-M GLOBAL -->
  <text x="35" y="215" fill="#3b0764" font-size="48" font-family="'Times New Roman', Georgia, serif" font-weight="bold" letter-spacing="4">
    TRI-M GL
  </text>

  <!-- Globe inside O -->
  <g transform="translate(308, 196)">
    <circle cx="20" cy="-14" r="20" fill="none" stroke="#3b0764" stroke-width="4" />
    <ellipse cx="20" cy="-14" rx="10" ry="20" fill="none" stroke="#3b0764" stroke-width="3" />
    <line x1="0" y1="-14" x2="40" y2="-14" stroke="#3b0764" stroke-width="3" />
    <path d="M 5 -24 Q 20 -18 35 -24" stroke="#3b0764" stroke-width="2.5" fill="none" />
    <path d="M 5 -4 Q 20 -10 35 -4" stroke="#3b0764" stroke-width="2.5" fill="none" />
  </g>

  <text x="360" y="215" fill="#3b0764" font-size="48" font-family="'Times New Roman', Georgia, serif" font-weight="bold" letter-spacing="4">
    BAL
  </text>

  <!-- Text: LOGISTICS & TRADING INC. -->
  <text x="65" y="258" fill="#3b0764" font-size="28" font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-weight="bold" letter-spacing="3">
    LOGISTICS &amp; TRADING INC.
  </text>
</svg>
